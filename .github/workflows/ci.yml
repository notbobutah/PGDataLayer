name: ci

# Human-owned workflow. Agents add tests and validators behind the npm scripts
# this calls (`npm test`, `npm run check`) — they never edit this file.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pgdatalayer:
    name: pgdatalayer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check --if-present
